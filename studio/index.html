<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mod Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="light a"></div><div class="light b"></div>
<header>
  <div class="brand"><span class="live"></span><b>ACCRETION</b>/ mod studio</div>
  <div class="sel" id="sel">no mod selected</div>
  <button id="runPhone" class="primary" title="build the .ipa, sign it, install it, open the game and read its log" disabled>Build and run on the phone</button>
  <button id="getBtn">Get .ipa</button>
  <button id="newBtn">New mod</button>
  <button id="themeBtn" title="Dark / light">Theme</button>
  <span id="studioVersion" class="small muted"></span>
  <button id="restartStudio" class="hidden">Load update</button>
</header>
<div class="layout">
  <aside class="card">
    <div class="row" style="margin-bottom:12px"><span class="label grow">Mods</span><button class="small ghost" id="reloadMods">Reload</button></div>
    <div class="mods" id="mods"></div>
    <p class="hint" id="amRoot"></p>
  </aside>
  <main class="card">
    <div class="tabs" id="tabs">
      <button data-tab="switches" class="active">Switches<span class="n" id="navCount"></span></button>
      <button data-tab="find">Find</button>
      <button data-tab="suggest">Suggest</button>
      <button data-tab="scan">Scan</button>
      <button data-tab="phone">Build &amp; Phone</button>
      <button data-tab="files">Files</button>
      <button data-tab="games">AppStore</button>
      <button data-tab="store">AccretionWeb</button>
      <button data-tab="console">Console</button>
    </div>
    <div class="status hidden" id="statusStrip" aria-label="This mod's state"></div>
    <section id="tab-switches"></section>
    <section id="tab-find" class="hidden"></section>
    <section id="tab-suggest" class="hidden"></section>
    <section id="tab-scan" class="hidden"></section>
    <section id="tab-phone" class="hidden"></section>
    <section id="tab-files" class="hidden"></section>
    <section id="tab-games" class="hidden"></section>
    <section id="tab-store" class="hidden"></section>
    <section id="tab-console" class="hidden"></section>
  </main>
  <aside class="card phonepanel" id="phonePanel" aria-label="On the phone">
    <div class="row"><h2 class="grow">On the phone</h2><span class="badge good hidden" id="phoneLive">live</span></div>
    <div class="lines" id="phoneLines"></div>
    <div class="acts">
      <button id="phoneWatch" title="reads the phone's log: each switch shows its state here">Watch the phone (5 min)</button>
      <button id="phonePush" title="sends this mod's switches to the installed game: they apply within 2 s, no build (needs a build that has live pins)">Push switches</button>
      <button id="phoneShotBtn" title="takes the phone's screen now and uploads it as a 1-year link for this mod's post">Phone screenshot</button>
    </div>
  </aside>
</div>
<section class="dock" id="jobsPanel" aria-label="Jobs">
  <div class="row bar">
    <span class="label">Jobs</span>
    <div class="chips" id="jobChips"></div>
    <button class="small ghost" id="clearJobs">Clear</button>
    <button class="small" id="jobsToggle" aria-expanded="false" aria-controls="jobsBody">Show</button>
  </div>
  <div class="body" id="jobsBody">
    <p class="hint" id="jobsHint">Output of builds, signing, logs and console commands shows here, under every tab.</p>
    <div id="jobs"></div>
  </div>
</section>

<dialog id="dlg"><div id="dlgBody"></div></dialog>

<script src="/app.js"></script>
</body>
</html>
