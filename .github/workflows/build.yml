name: Build mod

# Builds a mod and publishes it, from anywhere (the GitHub app on a phone: Actions -> Build mod ->
# Run, type the mod's folder name). Same steps as scripts/local_ipa.sh on a PC:
#   Theos and cyan pinned to exact commits; the base .ipa only from mod.json's base.ipa_url (or, for a
#   private base, from Accretion's storage via scripts/base.py) and only
#   if it matches base.sha256; the tweak injected; the result checked.
# Then the .ipa goes straight to Accretion's private storage (scripts/publish.py with the
# ACCRETION_UPLOAD_KEY secret) and releases.json / mods.json are committed. The .ipa is never kept
# as an artifact or release asset: those are downloadable by anyone signed in to GitHub.
on:
  workflow_dispatch:
    inputs:
      mod:
        description: "Mod folder under mods/, like swiftradio-plus"
        required: true
      publish:
        description: "Publish to catalogue (personal builds only keep a private copy)"
        type: boolean
        default: true

permissions:
  actions: write
  statuses: write
  contents: write

concurrency:
  group: publish-mod
  cancel-in-progress: false

env:
  THEOS_COMMIT: 304e0799973e8145f32e4ca2de6c747a84b758ce

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 75
    env:
      MOD: ${{ inputs.mod }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Check the mod
        id: check
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          [[ "$MOD" =~ ^[a-z0-9-]+$ ]] && [ -f "mods/$MOD/mod.json" ] || { echo "::error::No mod named \"$MOD\""; exit 1; }
          python3 scripts/validate_mods.py "$MOD"
          # a ready-made .deb (mod.json "deb") is injected as is: nothing to compile
          python3 -c 'import json,sys; print("deb=" + ("true" if "deb" in json.load(open(sys.argv[1])) else "false"))' \
            "mods/$MOD/mod.json" >> "$GITHUB_OUTPUT"
          python3 scripts/publication_status.py plan --mod "$MOD" >> "$GITHUB_OUTPUT"

      - name: Install Theos
        if: steps.check.outputs.deb != 'true'
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.3.0.app
          brew install --quiet make ldid
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          git clone --quiet --recursive https://github.com/theos/theos.git "$HOME/theos"
          git -C "$HOME/theos" checkout --quiet "$THEOS_COMMIT"
          git -C "$HOME/theos" submodule update --quiet --init --recursive
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build
        id: build
        env:
          REQUIRE_BASE_SHA256: "1"
          # fetches a private base (mod.json base.private) from Accretion's storage
          ACCRETION_UPLOAD_KEY: ${{ secrets.ACCRETION_UPLOAD_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          scripts/local_ipa.sh "$MOD" "" "$RUNNER_TEMP/out"

      - name: Check the .ipa
        id: verified
        run: python3 scripts/check_mod_ipa.py "$MOD" "${{ steps.build.outputs.ipa }}"

      - name: Keep a personal copy
        id: personal
        if: steps.check.outputs.personal == 'true'
        env:
          ACCRETION_UPLOAD_KEY: ${{ secrets.ACCRETION_UPLOAD_KEY }}
        run: |
          set -euo pipefail
          sha=$(python3 scripts/base.py put "${{ steps.build.outputs.ipa }}")
          {
            echo '### Retrieve the private personal build'
            echo '```'
            echo "python scripts/base.py get $sha $MOD.ipa"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish privately
        id: uploaded
        if: steps.check.outputs.catalogue == 'true'
        env:
          ACCRETION_UPLOAD_KEY: ${{ secrets.ACCRETION_UPLOAD_KEY }}
        run: |
          set -euo pipefail
          test -n "$ACCRETION_UPLOAD_KEY" || { echo "::error::The ACCRETION_UPLOAD_KEY secret isn't set"; exit 1; }
          python3 scripts/publish.py --mod "$MOD" --ipa "${{ steps.build.outputs.ipa }}"

      - name: Commit the source
        id: source
        if: steps.check.outputs.catalogue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases.json mods.json
          git diff --cached --quiet && exit 0
          git commit -m "Publish $MOD $VERSION" -m "Co-Authored-By: Codex <noreply@openai.com>"
          python3 scripts/checked_push.py mods

      - name: Summary
        if: always()
        env:
          VERSION: ${{ steps.build.outputs.version }}
          PUBLISH: ${{ inputs.publish }}
          CHECK_RESULT: ${{ steps.verified.outcome }}
          UPLOAD_RESULT: ${{ steps.uploaded.outcome }}
          SOURCE_RESULT: ${{ steps.source.outcome }}
          PERSONAL: ${{ steps.check.outputs.personal }}
          PERSONAL_RESULT: ${{ steps.personal.outcome }}
        run: |
          if [ -n "$VERSION" ]; then
            echo "### $MOD $VERSION" >> "$GITHUB_STEP_SUMMARY"
          fi
          python3 scripts/publication_status.py summary >> "$GITHUB_STEP_SUMMARY"
          rm -rf "$RUNNER_TEMP/out"
