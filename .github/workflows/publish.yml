name: "Mods: publish a mod"

# Publishes a mod build without the person or machine that built it holding the upload key.
#   1. scripts/stage.sh puts the .ipa in a DRAFT release here (drafts are visible only to people
#      with write access, so the file stays private) and starts this workflow.
#   2. This checks the .ipa, uploads it to Accretion's private storage with the
#      ACCRETION_UPLOAD_KEY repo secret (scripts/publish.py), commits releases.json and
#      mods.json, and deletes the draft.
on:
  workflow_dispatch:
    inputs:
      mod:
        description: "Mod to publish (a new public mod must be added to this list; CI checks it)"
        type: choice
        options: [swiftradio-plus]
        default: swiftradio-plus
      app_version:
        description: "Not used: the version comes from the .ipa (kept so older stage.sh runs still work)"
        required: false
        default: ""
      draft:
        description: "Draft release holding the .ipa, like stage-swiftradio-plus-20261014120000 (scripts/stage.sh prints it)"
        required: true
      min_os:
        description: "Minimum iOS version, like 17.0 (empty: the mod's default)"
        required: false
        default: ""

permissions:
  actions: write
  statuses: write
  contents: write

concurrency:
  group: publish-mod
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      MOD: ${{ inputs.mod }}
      DRAFT: ${{ inputs.draft }}
      MIN_OS: ${{ inputs.min_os }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Check the inputs
        run: |
          set -euo pipefail
          [[ "$MOD" =~ ^[a-z0-9-]+$ ]] && [ -f "mods/$MOD/mod.json" ] || { echo "::error::No mod named \"$MOD\""; exit 1; }
          [[ "$DRAFT" =~ ^stage-[A-Za-z0-9.-]+$ ]] || { echo "::error::\"$DRAFT\" isn't a staged draft name"; exit 1; }
          [ -z "$MIN_OS" ] || [[ "$MIN_OS" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]] || { echo "::error::\"$MIN_OS\" isn't an iOS version"; exit 1; }

      - name: Fetch the .ipa from the draft
        id: fetch
        run: |
          set -euo pipefail
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --slurp \
            | jq -c --arg d "$DRAFT" '[.[][] | select(.draft and .name == $d)] | first // empty')
          [ -n "$release" ] || { echo "::error::No draft release named $DRAFT"; exit 1; }
          asset=$(jq -r '[.assets[] | select(.name | endswith(".ipa"))] | if length == 1 then .[0].id else empty end' <<< "$release")
          [ -n "$asset" ] || { echo "::error::$DRAFT needs exactly one .ipa"; exit 1; }
          gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$asset" > "$RUNNER_TEMP/mod.ipa"
          echo "release=$(jq -r .id <<< "$release")" >> "$GITHUB_OUTPUT"

      # The file must be an app whose bundle ID is the mod's own
      - name: Check the .ipa
        id: verified
        run: python3 scripts/check_mod_ipa.py "$MOD" "$RUNNER_TEMP/mod.ipa"

      - name: Upload privately and update the source
        id: uploaded
        env:
          ACCRETION_UPLOAD_KEY: ${{ secrets.ACCRETION_UPLOAD_KEY }}
        run: |
          set -euo pipefail
          test -n "$ACCRETION_UPLOAD_KEY" || { echo "::error::The ACCRETION_UPLOAD_KEY secret isn't set"; exit 1; }
          python3 scripts/publish.py --mod "$MOD" --ipa "$RUNNER_TEMP/mod.ipa" ${MIN_OS:+--min-os "$MIN_OS"}

      - name: Commit the source
        id: source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases.json mods.json
          git diff --cached --quiet && exit 0
          git commit -m "Publish $MOD"
          python3 scripts/checked_push.py mods

      - name: Delete the draft
        if: always() && steps.fetch.outputs.release
        env:
          DRAFT_RELEASE: ${{ steps.fetch.outputs.release }}
          UPLOAD_RESULT: ${{ steps.uploaded.outcome }}
          SOURCE_RESULT: ${{ steps.source.outcome }}
        run: python3 scripts/publication_status.py cleanup

      - name: Summary
        if: always()
        env:
          CHECK_RESULT: ${{ steps.verified.outcome }}
          UPLOAD_RESULT: ${{ steps.uploaded.outcome }}
          SOURCE_RESULT: ${{ steps.source.outcome }}
          PUBLISH: "true"
        run: python3 scripts/publication_status.py summary >> "$GITHUB_STEP_SUMMARY"
